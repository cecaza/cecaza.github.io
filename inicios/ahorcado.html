<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego del Ahorcado</title>
<meta name="description" content="Recreación del juego del ahorcado que Cesar Carvajal hizo en sus inicios con HTML y JavaScript. El original se perdió.">
<meta name="robots" content="noindex">
<link rel="shortcut icon" href="../assets/favicon.png">
<style type="text/css">
body {
	margin: 0px;
	padding: 0px;
	background-color: #2c3e50;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 14px;
	color: #333333;
}
#principal {
	width: 95%;
	max-width: 640px;
	margin: 20px auto;
	background-color: #ffffff;
	border: 1px solid #000000;
	-webkit-border-radius: 8px;
	-moz-border-radius: 8px;
	border-radius: 8px;
	-webkit-box-shadow: 0px 0px 15px #000000;
	-moz-box-shadow: 0px 0px 15px #000000;
	box-shadow: 0px 0px 15px #000000;
	overflow: hidden;
}
#cabecera {
	background: #27ae60;
	background: -webkit-linear-gradient(top, #2ecc71, #1e8449);
	background: -moz-linear-gradient(top, #2ecc71, #1e8449);
	background: linear-gradient(to bottom, #2ecc71, #1e8449);
	color: #ffffff;
	text-align: center;
	padding: 12px;
	border-bottom: 3px solid #145a32;
}
#cabecera h1 {
	margin: 0px;
	font-family: "Arial Black", Arial, sans-serif;
	font-size: 32px;
	text-shadow: 2px 2px 0px #000000;
}
#cabecera p {
	margin: 4px 0px 0px 0px;
	font-size: 13px;
}
#contenido {
	padding: 15px;
	text-align: center;
}
#palabra {
	font-family: "Courier New", Courier, monospace;
	font-size: 28px;
	font-weight: bold;
	letter-spacing: 3px;
	word-wrap: break-word;
}
#pista {
	color: #666666;
	margin-top: 8px;
}
#fallos {
	margin-top: 8px;
}
#mensaje {
	font-size: 20px;
	font-weight: bold;
	margin: 12px 0px;
}
.letra {
	width: 36px;
	height: 36px;
	margin: 2px;
	font-size: 15px;
	font-weight: bold;
	color: #333333;
	cursor: pointer;
	border: 1px solid #888888;
	-webkit-border-radius: 4px;
	-moz-border-radius: 4px;
	border-radius: 4px;
	background: #eeeeee;
	background: -webkit-linear-gradient(top, #ffffff, #cccccc);
	background: -moz-linear-gradient(top, #ffffff, #cccccc);
	background: linear-gradient(to bottom, #ffffff, #cccccc);
}
.letra:hover {
	background: #dddddd;
}
.acierto, .acierto:hover {
	background: #7dcea0;
	color: #145a32;
	cursor: default;
}
.error, .error:hover {
	background: #f1948a;
	color: #78281f;
	cursor: default;
}
.boton {
	margin-top: 12px;
	padding: 8px 20px;
	font-size: 15px;
	font-weight: bold;
	color: #ffffff;
	cursor: pointer;
	border: 1px solid #145a32;
	-webkit-border-radius: 5px;
	-moz-border-radius: 5px;
	border-radius: 5px;
	background: #27ae60;
	background: -webkit-linear-gradient(top, #2ecc71, #1e8449);
	background: -moz-linear-gradient(top, #2ecc71, #1e8449);
	background: linear-gradient(to bottom, #2ecc71, #1e8449);
}
#pie {
	background-color: #eeeeee;
	border-top: 1px solid #cccccc;
	text-align: center;
	font-size: 11px;
	color: #777777;
	padding: 8px;
}
#pie a {
	color: #0000ee;
}
</style>
<script type="text/javascript">
// ============================================
//  JUEGO DEL AHORCADO
//  Hecho por: Cesar Carvajal
// ============================================
// TODO: poner niveles (facil, medio, dificil)
// TODO: agregar mas palabras

var palabras = new Array("COMPUTADOR", "PROGRAMA", "TECLADO", "INTERNET", "UNIVERSIDAD", "JAVASCRIPT", "PANTALLA", "MONTAÑA", "GUITARRA", "BALONCESTO", "ELEFANTE", "CHOCOLATE", "BICICLETA", "ARCHIVO", "VARIABLE");
var pistas = new Array("Maquina", "Lo que hace un programador", "Tiene muchas teclas", "La red de redes", "Donde se estudia una carrera", "Lenguaje de la web", "Se mira todo el dia", "Paisaje", "Instrumento", "Deporte", "Animal", "Dulce", "Transporte", "Se guarda en una carpeta", "Guarda un valor");
var letras = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";

var palabra = "";
var usadas = "";
var fallos = 0;
var jugando = false;
var intentos = 6; // ya no se usa, ahora es fallos
var canvas;
var ctx;

function iniciar() {
	canvas = document.getElementById("lienzo");
	ctx = canvas.getContext("2d");
	nuevoJuego();
}

function nuevoJuego() {
	//var n = parseInt(Math.random() * 10);
	var n = Math.floor(Math.random() * palabras.length);
	// para que no salga la misma palabra dos veces seguidas
	if (palabras[n] == palabra) {
		n = n + 1;
		if (n >= palabras.length) n = 0;
	}
	palabra = palabras[n];
	usadas = "";
	fallos = 0;
	jugando = true;

	document.getElementById("pista").innerHTML = "<b>Pista:</b> " + pistas[n];
	document.getElementById("mensaje").innerHTML = "&nbsp;";

	// crear los botones de las letras
	var botones = "";
	for (var i = 0; i < letras.length; i++) {
		botones = botones + "<input type='button' class='letra' id='btn" + letras.charAt(i) + "' value='" + letras.charAt(i) + "' onclick='jugar(this.value)'>";
	}
	document.getElementById("teclado").innerHTML = botones;

	mostrarPalabra();
	dibujar();
}

function jugar(l) {
	if (jugando == false) return;
	if (usadas.indexOf(l) != -1) return; // ya la uso

	usadas = usadas + l;
	var boton = document.getElementById("btn" + l);
	boton.disabled = true;

	if (palabra.indexOf(l) != -1)
	{
		boton.className = "letra acierto";
	}
	else{
		boton.className = "letra error";
		//boton.style.backgroundColor = "red";
		fallos++;
	}
	//console.log("letra: " + l + " fallos: " + fallos);

	mostrarPalabra();
	dibujar();
	revisar();
}

function mostrarPalabra() {
	var texto = "";
	for (var i = 0; i < palabra.length; i++) {
		if (usadas.indexOf(palabra.charAt(i)) != -1 || jugando == false) {
			texto = texto + palabra.charAt(i) + " ";
		} else {
			texto = texto + "_ ";
		}
	}
	document.getElementById("palabra").innerHTML = texto;
	document.getElementById("fallos").innerHTML = "Fallos: " + fallos + " / 6";
}

function revisar() {
	var gano = true;
	for (var i = 0; i < palabra.length; i++) {
		if (usadas.indexOf(palabra.charAt(i)) == -1) {
			gano = false;
		}
	}

	if (gano == true) {
		//alert("gano");
        jugando = false;
		document.getElementById("mensaje").innerHTML = "<font color='green'>GANASTE!!! :D</font>";
		// el timeout es para que alcance a pintar antes del alert
		setTimeout(function () { alert("Felicitaciones!!! adivinaste la palabra"); }, 100);
	} else if (fallos >= 6) {
		jugando = false;
		mostrarPalabra();
		document.getElementById("mensaje").innerHTML = "<font color='red'>PERDISTE :( la palabra era " + palabra + "</font>";
		setTimeout(function () { alert("GAME OVER"); }, 100);
	}

	// si ya termino se bloquean todas las letras
	if (jugando == false) {
		for (var i = 0; i < letras.length; i++) {
			document.getElementById("btn" + letras.charAt(i)).disabled = true;
		}
	}
}

function linea(x1, y1, x2, y2) {
	ctx.beginPath();
	ctx.moveTo(x1, y1);
	ctx.lineTo(x2, y2);
	ctx.stroke();
}

function dibujar() {
	ctx.clearRect(0, 0, 200, 220);

	// piso
	//ctx.fillStyle = "green";
	ctx.fillStyle = "#7dcea0";
	ctx.fillRect(0, 205, 200, 15);

	// la horca
	ctx.strokeStyle = "#6e2c00";
	ctx.lineWidth = 6;
	linea(20, 208, 120, 208);
	linea(50, 208, 50, 15);
	linea(47, 15, 140, 15);
	linea(50, 45, 80, 15);
	ctx.lineWidth = 2;
	linea(140, 15, 140, 40);

	// el muñeco
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 3;
	if (fallos >= 1) { // cabeza
        ctx.beginPath();
		ctx.arc(140, 58, 18, 0, Math.PI * 2, true);
		ctx.stroke();
	}
	if (fallos >= 2) linea(140, 76, 140, 135);  // cuerpo
	if (fallos >= 3) linea(140, 90, 115, 115);  // brazo izq
	if (fallos >= 4) linea(140, 90, 165, 115);  // brazo der
	if (fallos >= 5) linea(140, 135, 120, 170); // pierna izq
	if (fallos >= 6) {
		linea(140, 135, 160, 170); // pierna der
		// ojos en X
		ctx.lineWidth = 2;
		linea(131, 51, 137, 57); linea(137, 51, 131, 57);
		linea(143, 51, 149, 57); linea(149, 51, 143, 57);
	}
}

// para jugar con el teclado
document.onkeyup = function (e) {
	e = e || window.event;
	var tecla = e.keyCode || e.which;
	if (tecla >= 65 && tecla <= 90) {
		jugar(String.fromCharCode(tecla));
	}
	// la Ñ toca con el mouse xD
};
</script>
</head>
<body onload="iniciar()">

<div id="principal">
	<div id="cabecera">
		<h1>EL AHORCADO</h1>
		<p>Adivina la palabra antes de que se complete el muñeco!!</p>
	</div>

	<div id="contenido">
		<noscript><font color="red"><b>Tu navegador no tiene JavaScript activado, el juego no va a funcionar</b></font></noscript>
		<table width="100%" border="0" cellpadding="5" cellspacing="0">
			<tr>
				<td width="200" align="center" valign="middle">
					<canvas id="lienzo" width="200" height="220" style="border:1px solid #cccccc; max-width:100%;">
						Tu navegador no soporta canvas, actualizalo!!
					</canvas>
				</td>
				<td align="center" valign="middle">
					<div id="palabra"></div>
					<div id="pista"></div>
					<div id="fallos"></div>
				</td>
			</tr>
		</table>

		<div id="mensaje">&nbsp;</div>
		<div id="teclado"></div>
		<input type="button" class="boton" value="Jugar otra vez" onclick="nuevoJuego()">
	</div>

	<div id="pie">
		Desarrollado por Cesar Carvajal &copy; 2016 - Todos los derechos reservados<br>
		Mejor visto en Google Chrome<br><br>
		<a href="../#experiencia">&lt;&lt; Volver</a>
	</div>
</div>

</body>
</html>
